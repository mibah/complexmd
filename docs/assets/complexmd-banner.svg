<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-labelledby="t d">
  <title id="t">COMPLEX.md</title>
  <desc id="d">The COMPLEX.md wordmark with the tagline "An agent contract for complex systems models", next to a small network of nodes whose highlighted edges close into a loop.</desc>
  <style>
    .word { font: 700 104px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #1E1B4B; }
    .ext { fill: #4F46E5; }
    .tag { font: 400 30px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1E1B4B; }
    .loop { stroke: #4F46E5; stroke-width: 5; stroke-linecap: round; fill: none; }
    .side { stroke: #94A3B8; stroke-width: 2.5; stroke-linecap: round; }
    .node { fill: #4F46E5; }
    .hot { fill: #F2C14E; stroke: #1E1B4B; stroke-width: 3; }
    .out { fill: #94A3B8; }
    @media (prefers-color-scheme: dark) {
      .word, .tag { fill: #E0E7FF; }
      .ext { fill: #A5B4FC; }
      .loop { stroke: #A5B4FC; }
      .node { fill: #A5B4FC; }
      .hot { stroke: #E0E7FF; }
    }
  </style>
  <text class="word" x="50" y="190">COMPLEX<tspan class="ext">.md</tspan></text>
  <text class="tag" x="56" y="250">An agent contract for complex systems models</text>
  <g>
    <line class="side" x1="900" y1="185" x2="800" y2="90"/>
    <line class="side" x1="900" y1="185" x2="1040" y2="270"/>
    <line class="side" x1="900" y1="185" x2="1080" y2="160"/>
    <line class="side" x1="700" y1="120" x2="800" y2="90"/>
    <line class="side" x1="700" y1="120" x2="770" y2="220"/>
    <path class="loop" d="M800 90 L960 70 L1080 160 L1040 270 L900 300 L770 220 Z"/>
    <circle class="out" cx="700" cy="120" r="9"/>
    <circle class="out" cx="900" cy="185" r="9"/>
    <circle class="node" cx="800" cy="90" r="13"/>
    <circle class="node" cx="960" cy="70" r="13"/>
    <circle class="hot" cx="1080" cy="160" r="15"/>
    <circle class="node" cx="1040" cy="270" r="13"/>
    <circle class="node" cx="900" cy="300" r="13"/>
    <circle class="node" cx="770" cy="220" r="13"/>
  </g>
